<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assessment-Quality Platform</title>
    <script>
      // Applied before the first paint. Without this the page renders light, then flips to dark
      // once React mounts — a white flash on every single load for anyone using dark mode.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
      } catch (e) { /* private window: light, like everyone else's first visit */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
